<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entraînement à la rotation mentale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#1E2229;
    --bg-panel:#262B34;
    --bg-field:#7C8590;
    --ink:#F3F4F1;
    --ink-soft:#A9AFB8;
    --ink-faint:#6E7480;
    --accent:#3FA7A0;
    --accent-dim:#2C7A75;
    --warm:#E3B23C;
    --correct:#5CB584;
    --incorrect:#DD7A6E;
    --stimulus-ink:#15171C;
    --border:#363C46;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-app);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  .app{
    width:100%;
    max-width:720px;
    padding:28px 20px 60px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .app-title{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .app-title span{color:var(--accent);}
  .app-sub{
    font-size:0.8rem;
    color:var(--ink-faint);
  }

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- Menu ---------- */
  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
  }
  .field-label{
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-bottom:8px;
    display:block;
  }
  .segmented{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .seg-btn{
    flex:1 1 auto;
    min-width:150px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--ink-soft);
    padding:12px 14px;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .seg-btn .seg-btn-title{
    display:block;
    font-size:0.92rem;
    color:var(--ink);
    font-weight:500;
    margin-bottom:2px;
  }
  .seg-btn .seg-btn-desc{
    display:block;
    font-size:0.74rem;
    color:var(--ink-faint);
  }
  .seg-btn:hover{border-color:var(--ink-faint);}
  .seg-btn.active{
    border-color:var(--accent);
    background:rgba(63,167,160,0.12);
  }
  .seg-btn.active .seg-btn-title{color:var(--accent);}
  .seg-btn:focus-visible{outline:2px solid var(--warm); outline-offset:2px;}

  .preview-row{
    display:flex;
    align-items:center;
    gap:18px;
    background:var(--bg-field);
    border-radius:8px;
    padding:14px 18px;
    margin-bottom:20px;
  }
  .preview-box{width:64px;height:64px;flex:0 0 auto;color:var(--stimulus-ink);}
  .preview-box svg{width:100%;height:100%;}
  .preview-text{font-size:0.82rem;color:#20242B;line-height:1.45;}
  .preview-text strong{display:block;color:#14161A;margin-bottom:2px;font-size:0.88rem;}

  .btn-primary{
    background:var(--accent);
    color:#0F1418;
    border:none;
    font-weight:600;
    font-size:0.95rem;
    padding:13px 20px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
  }
  .btn-primary:hover{background:#4FBAB2;}
  .btn-secondary{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--border);
    font-size:0.85rem;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn-secondary:hover{color:var(--ink); border-color:var(--ink-faint);}

  .menu-footer{
    display:flex;
    justify-content:center;
    margin-top:16px;
  }

  /* ---------- Trial ---------- */
  .trial-screen{flex:1; display:flex; flex-direction:column;}
  .trial-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .trial-progress{font-size:0.78rem; color:var(--ink-soft);}
  .trial-progress .mono{color:var(--ink);}
  .quit-link{
    background:none;border:none;color:var(--ink-faint);
    font-size:0.78rem;cursor:pointer;text-decoration:underline;
    padding:4px;
  }
  .quit-link:hover{color:var(--ink);}

  .stimulus-field{
    flex:1;
    background:var(--bg-field);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:280px;
    position:relative;
    overflow:hidden;
  }
  .stimulus-field.flash-correct{box-shadow:inset 0 0 0 6px var(--correct);}
  .stimulus-field.flash-incorrect{box-shadow:inset 0 0 0 6px var(--incorrect);}
  .fixation{
    font-size:2.4rem;
    color:#2B2F36;
    font-weight:300;
  }
  .stimulus-svg{width:220px;height:220px;color:var(--stimulus-ink);overflow:visible;}
  .stimulus-letter{
    font-family:'Space Grotesk', sans-serif;
    font-size:100px;
    font-weight:700;
    fill:var(--stimulus-ink);
  }
  .stim-pair{display:flex;align-items:center;gap:36px;}
  .stim-pair .stimulus-svg{width:150px;height:150px;}
  .stim-pair .stimulus-letter{font-size:82px;}

  .response-bar{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .response-btn{
    flex:1 1 auto;
    min-width:64px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--ink);
    padding:14px 10px;
    border-radius:8px;
    font-size:0.92rem;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .response-btn:hover{border-color:var(--accent);}
  .response-btn:disabled{opacity:0.5; cursor:default;}
  .response-btn .key-hint{
    display:block;
    font-size:0.68rem;
    color:var(--ink-faint);
    margin-top:3px;
  }
  .hint-line{
    text-align:center;
    font-size:0.74rem;
    color:var(--ink-faint);
    margin-top:12px;
  }

  /* ---------- Results ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0 24px;
  }
  .stat-box{
    background:var(--bg-field);
    border-radius:8px;
    padding:16px;
    text-align:center;
  }
  .stat-value{font-size:1.7rem; font-weight:600; color:#14161A;}
  .stat-unit{font-size:0.85rem; color:#3C4048;}
  .stat-label{font-size:0.72rem; color:#4A4E56; margin-top:4px;}
  .results-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .results-actions button{flex:1 1 auto;}

  /* ---------- History ---------- */
  table.history-table{
    width:100%;
    border-collapse:collapse;
    font-size:0.82rem;
  }
  table.history-table th, table.history-table td{
    text-align:left;
    padding:9px 8px;
    border-bottom:1px solid var(--border);
  }
  table.history-table th{
    color:var(--ink-faint);
    font-weight:500;
    font-size:0.7rem;
    text-transform:none;
  }
  .empty-note{color:var(--ink-faint); font-size:0.85rem; padding:20px 0;}

  @media (max-width:480px){
    .stimulus-svg{width:160px;height:160px;}
    .stimulus-letter{font-size:76px;}
    .stim-pair{gap:20px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div class="app-title">Rotation <span>mentale</span></div>
    <div class="app-sub">imagerie visuelle · discrimination gauche / droite</div>
  </div>

  <!-- ===================== MENU ===================== -->
  <section id="screen-menu" class="screen active">
    <div class="card">
      <span class="field-label">Mode</span>
      <div class="segmented" id="mode-select">
        <button class="seg-btn" data-mode="1">
          <span class="seg-btn-title">Mode 1 — Orientation</span>
          <span class="seg-btn-desc">L'image est-elle tournée vers la gauche ou vers la droite ?</span>
        </button>
        <button class="seg-btn" data-mode="2">
          <span class="seg-btn-title">Mode 2 — Degré de rotation</span>
          <span class="seg-btn-desc">Estimer l'angle de rotation de l'image</span>
        </button>
        <button class="seg-btn" data-mode="3">
          <span class="seg-btn-title">Mode 3 — Comparaison</span>
          <span class="seg-btn-desc">Deux objets différents : même degré de rotation ?</span>
        </button>
      </div>

      <span class="field-label">Niveau de complexité</span>
      <div class="segmented" id="level-select">
        <button class="seg-btn" data-level="1">
          <span class="seg-btn-title">Niveau 1</span>
          <span class="seg-btn-desc">Lettres majuscules et chiffres</span>
        </button>
        <button class="seg-btn" data-level="2">
          <span class="seg-btn-title">Niveau 2</span>
          <span class="seg-btn-desc">Objets simples (maison, fleur, vélo)</span>
        </button>
        <button class="seg-btn" data-level="3">
          <span class="seg-btn-title">Niveau 3</span>
          <span class="seg-btn-desc">Photos d'objets du quotidien</span>
        </button>
      </div>

      <span class="field-label">Aperçu</span>
      <div class="preview-row">
        <div class="preview-box" id="preview-box"></div>
        <div class="preview-text" id="preview-text"></div>
      </div>

      <button class="btn-primary" id="start-btn">Commencer (24 essais)</button>
    </div>

    <div class="menu-footer">
      <button class="btn-secondary" id="history-btn">Voir l'historique</button>
    </div>
  </section>

  <!-- ===================== TRIAL ===================== -->
  <section id="screen-trial" class="screen trial-screen">
    <div class="trial-top">
      <button class="quit-link" id="quit-btn">✕ Quitter le bloc</button>
      <div class="trial-progress">Essai <span class="mono" id="trial-count">1</span><span class="mono">/24</span></div>
    </div>

    <div class="stimulus-field" id="stimulus-field">
      <div class="fixation" id="fixation">+</div>
    </div>

    <div class="response-bar" id="response-bar"></div>
    <div class="hint-line" id="hint-line"></div>
  </section>

  <!-- ===================== RESULTS ===================== -->
  <section id="screen-results" class="screen">
    <div class="card">
      <span class="field-label" id="results-config"></span>
      <h2 style="margin:0 0 4px;font-size:1.2rem;">Résultats du bloc</h2>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value mono" id="res-accuracy">0<span class="stat-unit">%</span></div>
          <div class="stat-label">Précision</div>
        </div>
        <div class="stat-box">
          <div class="stat-value mono" id="res-rt">0<span class="stat-unit">ms</span></div>
          <div class="stat-label">Temps de réponse moyen</div>
        </div>
      </div>
      <div class="results-actions">
        <button class="btn-primary" id="restart-btn">Refaire ce bloc</button>
        <button class="btn-secondary" id="menu-from-results-btn">Retour au menu</button>
      </div>
    </div>
  </section>

  <!-- ===================== HISTORY ===================== -->
  <section id="screen-history" class="screen">
    <div class="card">
      <h2 style="margin:0 0 14px;font-size:1.1rem;">Historique des sessions</h2>
      <div id="history-content"></div>
      <div class="results-actions" style="margin-top:16px;">
        <button class="btn-secondary" id="clear-history-btn">Effacer l'historique</button>
        <button class="btn-secondary" id="menu-from-history-btn">Retour au menu</button>
      </div>
    </div>
  </section>

</div>

    const s = im.circle ? 180 / im.w : 184 / Math.hypot(im.w, im.h);
    const w = im.w * s, h = im.h * s;

  Object.values(IMAGES).forEach(i => { const p = new Image(); p.src = i.src; });

  const SHAPES = {
    maison: () => `

    `,

    `,
    lampe: () => `
      <rect x="70" y="172" width="60" height="10" rx="4" />

    `,
    chaise: () => `
      <rect x="58" y="52" width="12" height="64" />

      <line x1="66" y1="122" x2="66" y2="172" />
      <line x1="134" y1="122" x2="134" y2="172" />
      <line x1="64" y1="116" x2="64" y2="172" />
      <line x1="118" y1="116" x2="118" y2="172" />
      <line x1="134" y1="122" x2="134" y2="96" />

    `,
    lunettes: () => `
      <circle cx="68" cy="100" r="30" />

      <line x1="161" y1="96" x2="188" y2="84" />
      <circle cx="160" cy="100" r="4" />
    `,
    cabane: () => imageShape("cabane"),
    champignon: () => imageShape("champignon"),
    chat: () => imageShape("chat"),
    cinq: () => imageShape("cinq"),
    eglise: () => imageShape("eglise"),
    lettreB: () => imageShape("lettreB"),
    perroquet: () => imageShape("perroquet"),
    photo_maisonnette: () => imageShape("photo_maisonnette"),
    photo_velo: () => imageShape("photo_velo"),
    photo_chaise: () => imageShape("photo_chaise"),
    photo_plante: () => imageShape("photo_plante"),
    photo_mangeoire: () => imageShape("photo_mangeoire"),
    photo_lampe: () => imageShape("photo_lampe"),
    photo_vase: () => imageShape("photo_vase"),
    theiere: () => `
      <ellipse cx="100" cy="122" rx="52" ry="36" />
      <path d="M52,120 Q100,132 148,120" />
      <ellipse cx="100" cy="84" rx="20" ry="8" />
      <circle cx="100" cy="76" r="6" />
      <path d="M150,108 C174,98 180,76 166,64" />

      <path d="M52,116 C28,106 28,140 52,150" />
      <path d="M58,118 C40,112 40,138 58,146" />
      <line x1="82" y1="156" x2="78" y2="164" />
      <line x1="118" y1="156" x2="122" y2="164" />
      <path d="M168,58 C172,52 168,48 172,42" />
      <path d="M178,62 C182,56 178,52 182,46" />
    `,
    avion: () => `
      <polygon points="34,100 70,94 172,100 70,106" />
      <ellipse cx="140" cy="99" rx="9" ry="4.5" />
      <polygon points="90,98 55,40 108,94" />
      <polygon points="90,102 55,160 108,106" />
      <line x1="70" y1="66" x2="86" y2="90" />
      <line x1="70" y1="134" x2="86" y2="110" />
      <ellipse cx="78" cy="66" rx="6" ry="10" />
      <ellipse cx="78" cy="134" rx="6" ry="10" />
      <polygon points="44,92 36,72 50,94" />
      <polygon points="44,108 36,128 50,106" />
      <circle cx="172" cy="100" r="4" />
    `,
    cle: () => `
      <circle cx="66" cy="82" r="26" />
      <circle cx="66" cy="82" r="13" />
      <line x1="92" y1="76" x2="162" y2="76" />
      <line x1="92" y1="88" x2="162" y2="88" />
      <line x1="92" y1="76" x2="92" y2="88" />
      <line x1="162" y1="76" x2="162" y2="88" />
      <line x1="118" y1="88" x2="118" y2="100" />
      <line x1="132" y1="88" x2="132" y2="108" />
      <line x1="146" y1="88" x2="146" y2="98" />
      <line x1="158" y1="88" x2="158" y2="104" />
    `,
    chaussure: () => `
      <path d="M40,150 C40,120 56,96 78,88 L104,80 C118,76 128,84 128,96 L128,112 L166,112 C176,112 176,150 160,150 Z" />
      <path d="M104,80 C112,86 116,92 112,100" />
      <line x1="84" y1="96" x2="100" y2="84" />
      <line x1="92" y1="100" x2="108" y2="88" />
      <line x1="100" y1="104" x2="116" y2="92" />
      <circle cx="88" cy="94" r="2.5" />
      <circle cx="96" cy="88" r="2.5" />
      <circle cx="104" cy="86" r="2.5" />
      <line x1="44" y1="118" x2="44" y2="136" />
      <line x1="70" y1="150" x2="70" y2="157" />
      <line x1="92" y1="150" x2="92" y2="157" />
      <line x1="114" y1="150" x2="114" y2="157" />
      <line x1="136" y1="150" x2="136" y2="157" />
    `
  };

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function buildStimulusEl(level, item, angle, mirrored){
    const svg = document.createElementNS(SVGNS,"svg");
    svg.setAttribute("viewBox","0 0 200 200");
    svg.setAttribute("class","stimulus-svg");
    svg.setAttribute("fill","none");
    svg.setAttribute("stroke","currentColor");
    svg.setAttribute("stroke-width","5");
    svg.setAttribute("stroke-linecap","round");
    svg.setAttribute("stroke-linejoin","round");
    const g = document.createElementNS(SVGNS,"g");
    const mx = mirrored ? -1 : 1;
    g.setAttribute("transform", `translate(100,100) rotate(${angle}) scale(${mx},1) translate(-100,-100)`);
    if (LEVELS[level].type === "text"){
      const t = document.createElementNS(SVGNS,"text");
      t.setAttribute("x","100"); t.setAttribute("y","100");
      t.setAttribute("text-anchor","middle");
      t.setAttribute("dominant-baseline","central");
      t.setAttribute("class","stimulus-letter");
      t.setAttribute("stroke","none");
      t.textContent = item;
      g.appendChild(t);
    } else {
      g.innerHTML = SHAPES[item]();
    }
    svg.appendChild(g);
    return svg;
  }

  /* ---------------- App state ---------------- */
  let state = null;
  let awaitingResponse = false;
  let pendingTimeouts = [];

  function clearPendingTimeouts(){
    pendingTimeouts.forEach(id=>clearTimeout(id));
    pendingTimeouts = [];
  }
  function after(ms, fn){
    const id = setTimeout(fn, ms);
    pendingTimeouts.push(id);
    return id;
  }

  /* ---------------- Screen navigation ---------------- */
  const screens = {
    menu: document.getElementById("screen-menu"),
    trial: document.getElementById("screen-trial"),
    results: document.getElementById("screen-results"),
    history: document.getElementById("screen-history")
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  /* ---------------- Menu ---------------- */
  let selectedMode = 1;
  let selectedLevel = 1;

  function refreshMenuSelection(){
    document.querySelectorAll("#mode-select .seg-btn").forEach(b=>{
      b.classList.toggle("active", Number(b.dataset.mode)===selectedMode);
    });
    document.querySelectorAll("#level-select .seg-btn").forEach(b=>{
      b.classList.toggle("active", Number(b.dataset.level)===selectedLevel);
    });
    updatePreview();
  }

  function updatePreview(){
    const box = document.getElementById("preview-box");
    box.innerHTML = "";
    const item = LEVELS[selectedLevel].items[0];
    box.appendChild(buildStimulusEl(selectedLevel, item, 0, false));

    const descByMode = {
      1: "Indiquez si l'image est tournée vers la <strong>gauche</strong> ou vers la <strong>droite</strong> par rapport à sa version d'origine.",
      2: "Estimez l'angle de rotation de l'image parmi 0°, 30°, 60°, 90°, 120°, 150° ou 180°.",
      3: "Deux objets <strong>différents</strong> sont montrés l'un après l'autre : indiquez s'ils ont le <strong>même</strong> degré de rotation."
    };
    document.getElementById("preview-text").innerHTML =
      `<strong>${LEVELS[selectedLevel].label}</strong>${descByMode[selectedMode]}`;
  }

  document.getElementById("mode-select").addEventListener("click", e=>{
    const btn = e.target.closest(".seg-btn");
    if(!btn) return;
    selectedMode = Number(btn.dataset.mode);
    refreshMenuSelection();
  });
  document.getElementById("level-select").addEventListener("click", e=>{
    const btn = e.target.closest(".seg-btn");
    if(!btn) return;
    selectedLevel = Number(btn.dataset.level);
    refreshMenuSelection();
  });
  document.getElementById("start-btn").addEventListener("click", ()=>{
    startBlock(selectedMode, selectedLevel);
  });
  document.getElementById("history-btn").addEventListener("click", openHistory);
  document.getElementById("menu-from-results-btn").addEventListener("click", ()=>showScreen("menu"));
  document.getElementById("menu-from-history-btn").addEventListener("click", ()=>showScreen("menu"));
  document.getElementById("restart-btn").addEventListener("click", ()=>{
    startBlock(state.mode, state.level);
  });
  document.getElementById("quit-btn").addEventListener("click", ()=>{
    if(confirm("Quitter ce bloc en cours ? La progression de ce bloc ne sera pas enregistrée.")){
      clearPendingTimeouts();
      awaitingResponse = false;
      showScreen("menu");
    }
  });

  refreshMenuSelection();

  /* ---------------- Trial construction ---------------- */
  function buildTrials(mode, level){
    const items = LEVELS[level].items;
    let trials = [];
    if(mode===1){
      for(let i=0;i<24;i++){
        trials.push({ item: pick(items), angle: ANGLES[i % ANGLES.length], mirrored: i<12 });
      }
      shuffle(trials);
    } else if(mode===2){
      let list = [];
      while(list.length<24) list = list.concat(shuffle(ANGLES.slice()));
      list = list.slice(0,24);
      for(let i=0;i<24;i++){
        trials.push({ item: pick(items), angle: list[i], mirrored: Math.random()<0.5 });
      }
      shuffle(trials);
    } else if(mode===3){
      for(let i=0;i<24;i++){
        const item1 = pick(items);
        const item2 = pick(items.filter(x=>x!==item1));
        const mirrored1 = Math.random()<0.5;
        const mirrored2 = Math.random()<0.5;
        const angle1 = pick(ANGLES);
        const same = i<12;
        let angle2 = angle1;
        if(!same){
          const others = ANGLES.filter(a=>a!==angle1);
          angle2 = pick(others);
        }
        trials.push({ item1, item2, mirrored1, mirrored2, angle1, angle2, same });
      }
      shuffle(trials);
    }
    return trials;
  }

  /* ---------------- Running a block ---------------- */
  function startBlock(mode, level){
    state = {
      mode, level,
      trials: buildTrials(mode, level),
      index: 0,
      responses: [],
      trialStartTime: 0
    };
    showScreen("trial");
    buildResponseBar(mode);
    runTrial();
  }

  function buildResponseBar(mode){
    const bar = document.getElementById("response-bar");
    bar.innerHTML = "";
    const hint = document.getElementById("hint-line");
    if(mode===1){
      bar.innerHTML = `
        <button class="response-btn" data-val="gauche">◀ Gauche<span class="key-hint">flèche gauche</span></button>
        <button class="response-btn" data-val="droite">Droite ▶<span class="key-hint">flèche droite</span></button>`;
      hint.textContent = "L'image est-elle tournée vers la gauche ou vers la droite ?";
    } else if(mode===2){
      bar.innerHTML = ANGLES.map((a,i)=>
        `<button class="response-btn" data-val="${a}">${a}°<span class="key-hint">${i+1}</span></button>`
      ).join("");
      hint.textContent = "Quel est le degré de rotation de l'image ?";
    } else if(mode===3){
      bar.innerHTML = `
        <button class="response-btn" data-val="meme">Identique<span class="key-hint">flèche gauche</span></button>
        <button class="response-btn" data-val="different">Différent<span class="key-hint">flèche droite</span></button>`;
      hint.textContent = "Les deux objets ont-ils le même degré de rotation ?";
    }
    bar.querySelectorAll(".response-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(!awaitingResponse) return;
        handleResponse(btn.dataset.val);
      });
    });
  }

  document.addEventListener("keydown", e=>{
    if(!awaitingResponse || !state) return;
    if(state.mode===1 || state.mode===3){
      if(e.key==="ArrowLeft") handleResponse(state.mode===1?"gauche":"meme");
      else if(e.key==="ArrowRight") handleResponse(state.mode===1?"droite":"different");
    } else if(state.mode===2){
      const idx = Number(e.key)-1;
      if(idx>=0 && idx<ANGLES.length) handleResponse(String(ANGLES[idx]));
    }
  });

  function runTrial(){
    if(state.index >= state.trials.length){
      finishBlock();
      return;
    }
    document.getElementById("trial-count").textContent = state.index+1;
    setResponseButtonsEnabled(false);
    const field = document.getElementById("stimulus-field");
    field.classList.remove("flash-correct","flash-incorrect");
    field.innerHTML = `<div class="fixation">+</div>`;

    after(450, ()=>{
      const trial = state.trials[state.index];
      if(state.mode===1 || state.mode===2){
        field.innerHTML = "";
        field.appendChild(buildStimulusEl(state.level, trial.item, trial.angle, trial.mirrored));
        state.trialStartTime = performance.now();
        setResponseButtonsEnabled(true);
      } else if(state.mode===3){
        field.innerHTML = "";
        field.appendChild(buildStimulusEl(state.level, trial.item1, trial.angle1, trial.mirrored1));
        after(1200, ()=>{
          field.innerHTML = `<div class="fixation">+</div>`;
          after(350, ()=>{
            field.innerHTML = "";
            field.appendChild(buildStimulusEl(state.level, trial.item2, trial.angle2, trial.mirrored2));
            state.trialStartTime = performance.now();
            setResponseButtonsEnabled(true);
          });
        });
      }
    });
  }

  function setResponseButtonsEnabled(enabled){
    awaitingResponse = enabled;
    document.querySelectorAll("#response-bar .response-btn").forEach(b=>{ b.disabled = !enabled; });
  }

  function handleResponse(value){
    if(!awaitingResponse) return;
    setResponseButtonsEnabled(false);
    const rt = Math.round(performance.now() - state.trialStartTime);
    const trial = state.trials[state.index];
    let correct = false;
    let correctAnswer = "";
    if(state.mode===1){
      const natural = FACING[trial.item] || "droite";
      const opposite = natural === "droite" ? "gauche" : "droite";
      correctAnswer = trial.mirrored ? opposite : natural;
      correct = value === correctAnswer;
    } else if(state.mode===2){
      correctAnswer = String(trial.angle);
      correct = value === correctAnswer;
    } else if(state.mode===3){
      correctAnswer = trial.same ? "meme" : "different";
      correct = value === correctAnswer;
    }
    state.responses.push({ ...trial, response:value, correctAnswer, correct, rt });

    const field = document.getElementById("stimulus-field");
    field.classList.add(correct ? "flash-correct" : "flash-incorrect");

    after(500, ()=>{
      state.index += 1;
      runTrial();
    });
  }

  /* ---------------- Results ---------------- */
  function finishBlock(){
    const responses = state.responses;
    const correctCount = responses.filter(r=>r.correct).length;
    const accuracy = Math.round((correctCount/responses.length)*100);
    const meanRT = Math.round(responses.reduce((s,r)=>s+r.rt,0)/responses.length);

    document.getElementById("results-config").textContent =
      `${MODE_LABELS[state.mode]} · ${LEVELS[state.level].label}`;
    document.getElementById("res-accuracy").innerHTML = `${accuracy}<span class="stat-unit">%</span>`;
    document.getElementById("res-rt").innerHTML = `${meanRT}<span class="stat-unit">ms</span>`;

    saveSession({
      timestamp: Date.now(),
      mode: state.mode,
      level: state.level,
      accuracy,
      meanRT,
      trials: responses
    });

    showScreen("results");
  }

  /* ---------------- Persistence ---------------- */
  function loadSessions(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveSession(session){
    const sessions = loadSessions();
    sessions.push(session);
    while(sessions.length>100) sessions.shift();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }
    catch(e){ /* stockage indisponible : les résultats restent visibles à l'écran seulement */ }
  }

  function openHistory(){
    const sessions = loadSessions().slice().sort((a,b)=>b.timestamp-a.timestamp);
    const content = document.getElementById("history-content");
    if(sessions.length===0){
      content.innerHTML = `<div class="empty-note">Aucune session enregistrée pour le moment.</div>`;
    } else {
      const rows = sessions.map(s=>{
        const d = new Date(s.timestamp);
        const dateStr = d.toLocaleDateString('fr-FR') + " " + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
        return `<tr>
          <td class="mono">${dateStr}</td>
          <td>${MODE_LABELS[s.mode]}</td>
          <td>${LEVELS[s.level].label}</td>
          <td class="mono">${s.accuracy}%</td>
          <td class="mono">${s.meanRT}ms</td>
        </tr>`;
      }).join("");
      content.innerHTML = `<table class="history-table">
        <thead><tr><th>Date</th><th>Mode</th><th>Niveau</th><th>Précision</th><th>TR moyen</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }
    showScreen("history");
  }

  document.getElementById("clear-history-btn").addEventListener("click", ()=>{
    if(confirm("Effacer définitivement tout l'historique enregistré sur cet appareil ?")){
      localStorage.removeItem(STORAGE_KEY);
      openHistory();
    }
  });

})();
</script>
